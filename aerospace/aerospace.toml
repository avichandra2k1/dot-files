start-at-login = true
after-login-command = []
#after-startup-command = [
#  'exec-and-forget ~/.config/sketchybar/plugins/media_stream.sh'
#]

key-mapping.preset = 'qwerty'

enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = true


#start-at-login = false

accordion-padding = 25

default-root-container-layout = 'tiles'
default-root-container-orientation = 'horizontal'

# Notify sketchybar about workspace change
exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'sketchybar --trigger aerospace_workspace_changed FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# Mouse follows focus when focused monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

on-focus-changed = [
  "move-mouse window-lazy-center"
  #'exec-and-forget sketchybar --trigger front_app_switched'
]

# >>> gaps: managed by ~/.config/aerospace/set-gaps.sh, edited by shift-alt-g >>>
[gaps]
outer.top =        [{ monitor."built-in.*" = 0 }, 31]
outer.left =       [{ monitor."built-in.*" = 0 }, 0]
outer.bottom =     [{ monitor."built-in.*" = 0 }, 0]
outer.right =      [{ monitor."built-in.*" = 0 }, 0]
inner.horizontal = [{ monitor."built-in.*" = 6 }, 6]
inner.vertical =   [{ monitor."built-in.*" = 6 }, 6]
# <<< gaps <<<

[mode.main.binding]
#cmd-h = [] # Disable "hide application"
cmd-alt-h = [] # Disable "hide others"

alt-shift-comma = [
  'mode service',
  'exec-and-forget sketchybar --trigger send_message MESSAGE="Aerospace in Service Mode" HOLD="true"',
]

shift-alt-g = 'exec-and-forget /Users/avi/.config/aerospace/set-gaps.sh toggle' # gaps on/off

alt-v = 'split vertical' # 'layout toggle split' in i3
alt-c = 'split horizontal'


alt-a = 'workspace a'
alt-b = 'workspace b'
alt-n = 'workspace n'
alt-m = 'workspace m'
alt-s = 'workspace s'

alt-shift-a = 'move-node-to-workspace a'
alt-shift-b = 'move-node-to-workspace b'
alt-shift-n = 'move-node-to-workspace n'
alt-shift-m = 'move-node-to-workspace m'
alt-shift-s = 'move-node-to-workspace s'

#alt-shift-a = ['move-node-to-workspace 1','workspace 1']
#alt-shift-b = ['move-node-to-workspace b','workspace b']
#alt-shift-n = ['move-node-to-workspace n','workspace n']
#alt-shift-m = ['move-node-to-workspace m','workspace m']


#alt-tab = 'workspace-back-and-forth'
#alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

alt-slash = 'layout tiles horizontal'
alt-comma = 'layout accordion horizontal'
#alt-f = 'layout accordion horizontal'
alt-f = 'fullscreen'

# See: https://nikitabobko.github.io/AeroSpace/commands#focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# See: https://nikitabobko.github.io/AeroSpace/commands#move
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# See: https://nikitabobko.github.io/AeroSpace/commands#resize
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# Join with
alt-ctrl-h = 'join-with left'
alt-ctrl-j = 'join-with down'
alt-ctrl-k = 'join-with up'
alt-ctrl-l = 'join-with right'


alt-shift-f = 'layout floating tiling' # 'floating toggle' in i3

#alt-shift-s = 'exec-and-forget sketchybar --trigger aerospace_switch'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
alt-q = 'focus-monitor --wrap-around prev'
alt-e = 'focus-monitor --wrap-around next'
alt-shift-q = 'move-node-to-monitor --wrap-around prev'
alt-shift-e = 'move-node-to-monitor --wrap-around next'

# See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
ctrl-shift-tab = 'move-workspace-to-monitor --wrap-around next'

[mode.service.binding]
esc = [
  'reload-config', 
  'mode main', 
  'exec-and-forget sketchybar --reload',
  #'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=4.0',
  'exec-and-forget sleep 0.5 && sketchybar --trigger send_message MESSAGE="Aerospace Reloaded"',
]
r = [
  'flatten-workspace-tree', 
  'mode main',
  'exec-and-forget sleep 0.5 && sketchybar --trigger hide_message',
] 
f = [
  'layout floating tiling', 
  'mode main',
  'exec-and-forget sleep 0.5 && sketchybar --trigger hide_message',
] 
# backspace = ['close-all-windows-but-current', 'mode main']

minus = 'resize smart -50'
equal = 'resize smart +50'

alt-h = ['join-with left', 'mode main']
alt-j = ['join-with down', 'mode main']
alt-k = ['join-with up', 'mode main']
alt-l = ['join-with right', 'mode main']

